{% extends "base.html" %}
{% from "_macros.html" import need with context %}

{% block content %}
<article class="mx-auto max-w-3xl px-4 py-12 sm:px-6 sm:py-16">
  <h1 class="text-3xl font-semibold tracking-tight">{% block heading %}{% endblock %}</h1>
  <p class="mt-2 text-sm text-ink-500 dark:text-ink-400">Last updated: {{ need(legal_last_updated, "LEGAL_LAST_UPDATED") }}</p>
  <div class="prose-legal mt-8">
    {% block body %}{% endblock %}
  </div>
</article>
{% endblock %}
