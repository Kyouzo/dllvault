{% extends "base.html" %}
{% block title %}{{ status }} · {{ site_name }}{% endblock %}
{% block content %}
<section class="mx-auto flex max-w-xl flex-col items-center px-4 py-24 text-center sm:px-6">
  <p class="font-mono text-sm font-medium text-accent dark:text-accent-300">{{ status }}</p>
  <h1 class="mt-3 text-2xl font-semibold tracking-tight sm:text-3xl">{{ message }}</h1>
  <a href="{{ url_for('index') }}" class="btn-primary mt-8">Upload a file</a>
</section>
{% endblock %}
